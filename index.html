<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de CR UNIFESP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Calculadora de CR UNIFESP</h1>

    <div class="container">
        <div class="form-container">
            <h2 id="form-title">Adicionar Matéria</h2>
            <form id="materia-form">
                <input type="hidden" id="materia-id">
                <div class="input-group">
                    <label for="nome">Nome da Matéria</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="input-group">
                    <label for="peso">Peso/Carga</label>
                    <input type="number" id="peso" required>
                </div>
                <div class="input-group">
                    <label for="nota">Nota</label>
                    <input type="number" id="nota" step="0.1" required>
                </div>
                <button type="submit" class="but" id="form-button">Adicionar</button>
                <button type="button" class="but" id="cancel-button" style="display: none;">Cancelar</button>
            </form>
        </div>

        <div id="materias-list-container">
            <h2>Minhas Matérias</h2>
            <div id="materiasContainer"></div>
        </div>
    </div>

    <div id="resultado">
        <p id="result"></p>
    </div>

    <script src="main.js"></script>
</body>
</html>
